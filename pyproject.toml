[project]
name = "ios-activity-monitor"
version = "0.1.0"
description = "Device engine for the iOS Activity Monitor macOS app."
requires-python = ">=3.12"
dependencies = [
    "pymobiledevice3>=9.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ios_activity_monitor"]
